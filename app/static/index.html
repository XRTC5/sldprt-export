<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sldprt-export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  /* An inspection bench, not a viewer. The user's real question is whether
     the part converted correctly and whether it will print, so the
     measurements carry the typographic weight and the geometry gets the
     space. Structure comes from hairline rules and a shared number axis
     rather than from cards. */
  :root {
    --bench:       #1b1f24;   /* anodised graphite ground */
    --bench-deep:  #14181c;   /* the viewer well, recessed */
    --bench-raise: #222830;   /* the one raised surface: the parts rail */
    --rule:        #2c333b;
    --rule-strong: #3d4650;
    --ink:         #e9edf0;
    --ink-soft:    #8d99a4;
    --ink-faint:   #5d6872;
    --pass:        #5fd3a6;   /* verified, watertight */
    --flag:        #e0a33e;   /* needs attention */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bench);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums lining-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- frame */

  .bench {
    display: grid;
    grid-template-columns: 252px minmax(0, 1fr) 268px;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
  }

  .masthead {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 1.15rem 1.5rem 1rem;
    border-bottom: 1px solid var(--rule);
  }

  .masthead h1 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.012em;
  }

  .masthead p { margin: 0; color: var(--ink-soft); }

  .masthead .local {
    margin-left: auto;
    color: var(--ink-faint);
    font-size: 0.8125rem;
  }

  /* -------------------------------------------------------- parts rail */

  .rail {
    background: var(--bench-raise);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 1rem 1.1rem 0.7rem;
    color: var(--ink-soft);
  }

  .rail-head span:last-child { color: var(--ink-faint); }

  .queue { overflow-y: auto; flex: 1; min-height: 0; }

  .part {
    position: relative;
    width: 100%;
    display: block;
    text-align: left;
    padding: 0.7rem 2.4rem 0.75rem 1.1rem;
    background: none;
    border: 0;
    border-top: 1px solid var(--rule);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .part:last-child { border-bottom: 1px solid var(--rule); }
  .part:hover { background: #262d36; }

  .part[aria-current='true'] {
    background: #262d36;
    box-shadow: inset 2px 0 0 var(--pass);
  }

  .part b { display: block; font-weight: 500; overflow-wrap: anywhere; }

  .part i {
    font-style: normal;
    color: var(--ink-soft);
    font-size: 0.8125rem;
  }

  .part[data-state='failed'] i { color: var(--flag); }

  .remove {
    position: absolute;
    top: 50%;
    right: 0.55rem;
    translate: 0 -50%;
    width: 1.7rem;
    height: 1.7rem;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--ink-faint);
    cursor: pointer;
    opacity: 0;
  }

  .part:hover .remove, .remove:focus-visible { opacity: 1; }
  .remove:hover { background: #333c47; color: var(--ink); }

  .drop {
    margin: 0.9rem 1.1rem 1.1rem;
    padding: 1.15rem 0.9rem;
    border: 1px dashed var(--rule-strong);
    border-radius: 4px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  .drop:hover, .drop.over { border-color: var(--pass); color: var(--ink); }
  .drop b { display: block; font-weight: 500; color: var(--ink); }
  .drop small { font-size: 0.8125rem; }

  input[type='file'] { display: none; }

  /* ------------------------------------------------------------ viewer */

  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Graph paper: a fine grid with a heavier line every fifth, the way a
     drawing sheet or a machine bed is ruled. It gives the part a surface to
     sit on and a sense of scale that a flat void does not. */
  .viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      linear-gradient(to right, rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
      linear-gradient(to bottom, rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
      linear-gradient(to right, rgba(255, 255, 255, 0.10) 1px, transparent 1px) 0 0 / 150px 150px,
      linear-gradient(to bottom, rgba(255, 255, 255, 0.10) 1px, transparent 1px) 0 0 / 150px 150px,
      radial-gradient(ellipse at 50% 45%, #202730 0%, #0f1317 78%);
  }

  /* The grid should fade at the edges so it frames rather than competes. */
  .viewer::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, #0f1317 96%);
  }

  .viewer.over::before {
    content: '';
    position: absolute;
    inset: 10px;
    z-index: 2;
    border: 2px dashed var(--pass);
    border-radius: 6px;
    pointer-events: none;
  }

  .viewer canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

  /* With nothing loaded the whole viewer is the drop target. Reading a part
     is the point of the tool, so the invitation gets the largest surface
     rather than a box tucked into the sidebar. */
  .empty {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 0.6rem;
    padding: 2rem;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .empty strong {
    font-size: 1.75rem;
    font-weight: 450;
    letter-spacing: -0.015em;
    color: var(--ink);
  }

  .empty span { max-width: 34ch; }

  .empty kbd {
    margin-top: 0.4rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font: inherit;
    color: var(--ink);
  }

  .empty:hover kbd { border-color: var(--pass); }

  .empty img {
    max-width: min(520px, 100%);
    max-height: 48vh;
    border-radius: 3px;
  }

  /* The bar carries three groups now, so it wraps instead of squashing its
     buttons into two-line labels. */
  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.7rem 1rem;
    border-top: 1px solid var(--rule);
  }

  .controls button { white-space: nowrap; }

  /* The two exports are one decision, so they wrap together rather than
     leaving 3MF stranded on its own line. */
  .export-set { display: flex; gap: 0.4rem; margin-left: auto; }

  .controls .spacer { flex: 1; }

  .controls .divider {
    width: 1px;
    align-self: stretch;
    margin: 0 0.35rem;
    background: var(--rule);
  }

  .section-set { display: flex; align-items: center; gap: 0.45rem; }
  .section-set.hide { display: none; }

  button.tool.axis { min-width: 2.1rem; text-align: center; }

  /* A cut position is a continuous quantity, so it gets a slider rather than
     stepped buttons, and reads out in millimetres beside it. */
  #cut {
    width: 132px;
    height: 2px;
    appearance: none;
    background: var(--rule-strong);
    border-radius: 2px;
    cursor: ew-resize;
  }

  #cut::-webkit-slider-thumb {
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--pass);
    cursor: ew-resize;
  }

  #cut::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: 0;
    border-radius: 50%;
    background: var(--pass);
    cursor: ew-resize;
  }

  #cutAt { color: var(--ink-soft); min-width: 5.4rem; }

  .viewer.measuring canvas { cursor: crosshair; }

  /* The measurement floats over the part, where the dimension is, rather
     than in a panel away from the thing being measured. */
  .caliper {
    position: absolute;
    z-index: 4;
    translate: -50% -50%;
    padding: 0.25rem 0.55rem;
    border: 1px solid var(--pass);
    border-radius: 3px;
    background: rgba(16, 24, 22, 0.92);
    color: var(--ink);
    font-weight: 500;
    white-space: nowrap;
    pointer-events: none;
  }

  /* A span taken off a face rather than a snapped vertex or edge is only as
     good as the clicking. The amber border says so without a sentence. */
  .caliper.loose {
    border-color: var(--flag);
    background: rgba(28, 22, 12, 0.92);
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 1rem;
    translate: -50% 0;
    z-index: 4;
    padding: 0.35rem 0.75rem;
    border-radius: 3px;
    background: rgba(16, 20, 24, 0.9);
    color: var(--ink-soft);
    pointer-events: none;
  }

  button.tool {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    cursor: pointer;
  }

  button.tool:hover:not(:disabled) { color: var(--ink); border-color: #4c5762; }
  button.tool[aria-pressed='true'] { background: #313a44; color: var(--ink); }
  button.tool:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Export is what the tool is for, so it is the largest control on the
     bench and the only filled one. */
  button.export {
    padding: 0.6rem 1.35rem;
    border: 1px solid transparent;
    border-radius: 4px;
    background: var(--pass);
    color: #10201a;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
  }

  button.export:hover:not(:disabled) { background: #77e0b8; }

  button.export.secondary {
    background: transparent;
    border-color: var(--pass);
    color: var(--pass);
  }

  button.export.secondary:hover:not(:disabled) { background: rgba(95, 211, 166, 0.12); }

  button.export:disabled {
    background: transparent;
    border-color: var(--rule);
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  :focus-visible { outline: 2px solid var(--pass); outline-offset: 2px; }

  /* ----------------------------------------------------------- readout */

  .readout {
    border-left: 1px solid var(--rule);
    overflow-y: auto;
    min-height: 0;
    padding-bottom: 1.5rem;
  }

  .readout h2 {
    margin: 0;
    padding: 1rem 1.1rem 0.7rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .measure {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 1.1rem;
    border-top: 1px solid var(--rule);
  }

  .measure dt { color: var(--ink-soft); }
  .measure dd { margin: 0; font-weight: 500; }
  .measure dd u { text-decoration: none; color: var(--ink-faint); }
  .measure.is-pass dd { color: var(--pass); }
  .measure.is-flag dd { color: var(--flag); }

  /* The headline figure: the one number the whole page exists to produce. */
  .headline { padding: 0.9rem 1.1rem 1rem; border-top: 1px solid var(--rule); }

  .headline dd {
    margin: 0;
    font-size: 2.125rem;
    font-weight: 450;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .headline dt { color: var(--ink-soft); }

  .verdict {
    margin: 0.9rem 1.1rem 0;
    padding: 0.7rem 0.8rem;
    border-left: 2px solid var(--flag);
    background: #23262a;
    color: var(--ink-soft);
    font-size: 0.8125rem;
  }

  .verdict.good { border-left-color: var(--pass); }
  .verdict b { display: block; color: var(--ink); font-weight: 500; }

  .listing { margin: 0.9rem 1.1rem 0; color: var(--ink-soft); font-size: 0.8125rem; }

  .listing h3 {
    margin: 0 0 0.3rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ink);
  }

  .listing ul { margin: 0 0 0.9rem; padding-left: 1rem; }
  .listing li { overflow-wrap: anywhere; }

  .hide { display: none !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 1080px) {
    .bench {
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: auto minmax(340px, 1fr) auto;
      height: auto;
      min-height: 100vh;
    }
    .readout { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); }
  }

  @media (max-width: 720px) {
    .bench { grid-template-columns: minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--rule); }
    .masthead { flex-wrap: wrap; }
    .masthead .local { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="bench">
  <header class="masthead">
    <h1>sldprt-export</h1>
    <p>Reads SolidWorks parts without SolidWorks</p>
    <span class="local">Runs on this machine. Nothing is uploaded.</span>
  </header>

  <div class="rail">
    <div class="rail-head">
      <span>Parts</span>
      <span id="count"></span>
    </div>
    <div class="queue" id="queue"></div>
    <div class="drop" id="drop" tabindex="0" role="button">
      <b>Drop a part</b>
      <small>.sldprt .sldasm .stl .3mf .obj</small>
    </div>
    <input type="file" id="picker" multiple accept=".sldprt,.sldasm,.stl,.3mf,.obj">
  </div>

  <div class="stage">
    <div class="viewer" id="viewer">
      <div class="empty" id="empty">
        <strong>Drop a part here</strong>
        <span>Reads the geometry out of a SolidWorks file and exports it as a mesh.</span>
        <kbd>.sldprt .sldasm .stl .3mf .obj</kbd>
      </div>
      <div class="caliper hide" id="caliper"></div>
      <div class="hint hide" id="hint"></div>
    </div>
    <div class="controls">
      <button class="tool" id="bShaded" aria-pressed="true">Shaded</button>
      <button class="tool" id="bWire" aria-pressed="false">Wireframe</button>
      <button class="tool" id="bFit">Fit</button>
      <span class="divider"></span>
      <button class="tool" id="bSection" aria-pressed="false">Section</button>
      <span class="section-set hide" id="sectionSet">
        <button class="tool axis" id="bAxis" title="Cut along">X</button>
        <input type="range" id="cut" min="0" max="1000" value="500" aria-label="Cut position">
        <output id="cutAt"></output>
      </span>
      <span class="divider"></span>
      <button class="tool" id="bMeasure" aria-pressed="false">Measure</button>
      <span class="spacer"></span>
      <span class="export-set">
        <button class="export" id="bStl" disabled>Export STL</button>
        <button class="export secondary" id="bMf" disabled>Export 3MF</button>
      </span>
    </div>
  </div>

  <div class="readout" id="readout">
    <h2>Measurements</h2>
    <div id="measures"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

const $ = (id) => document.getElementById(id)
const parts = []
let active = -1

const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmtB = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                  : n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B'
const num = (n) => n.toLocaleString('en-GB')

// ------------------------------------------------------------------ viewer

const viewer = $('viewer')
let renderer, scene, camera, controls, solid, wire, inside

/* A clipping plane on its own leaves a hollow shell: you see straight
   through the wall and the cut does not read. A second copy of the geometry
   drawn back-faces-only, in a warmer tone, fills that opening so the cut
   face looks like material rather than a hole. */
const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)
const AXES = ['X', 'Y', 'Z']
let axis = 0
let sectioning = false

const measure3 = { on: false, points: [], kinds: [], markers: [], line: null }
const raycaster = new THREE.Raycaster()
const pointer = new THREE.Vector2()

function initViewer() {
  if (renderer) return
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
  renderer.localClippingEnabled = true
  viewer.appendChild(renderer.domElement)

  scene = new THREE.Scene()
  camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100000)
  controls = new OrbitControls(camera, renderer.domElement)
  controls.enableDamping = true

  /* Three lights doing three jobs. A flat grey part on a dark ground reads
     as a silhouette with no form, so: a key to model the surface, a cool
     hemisphere so the shadow side stays legible instead of going black, and
     a rim from behind to separate the part from the background. */
  scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x39424c, 1.15))

  const key = new THREE.DirectionalLight(0xfff4e6, 2.1)
  key.position.set(1.0, 1.25, 0.85)
  scene.add(key)

  const fill = new THREE.DirectionalLight(0xc8dcec, 0.7)
  fill.position.set(-1.1, -0.25, 0.6)
  scene.add(fill)

  const rim = new THREE.DirectionalLight(0xffffff, 1.5)
  rim.position.set(-0.5, 0.6, -1.3)
  scene.add(rim)

  resize()
  new ResizeObserver(resize).observe(viewer)
  renderer.setAnimationLoop(() => {
    controls.update()
    renderer.render(scene, camera)
    if (measure3.points.length === 2) updateCaliper()
  })

  renderer.domElement.addEventListener('click', onMeasureClick)
}

function resize() {
  if (!renderer) return
  const w = viewer.clientWidth, h = viewer.clientHeight || 420
  renderer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}

function clearModel() {
  clearMeasure()
  clearSnapIndex()
  for (const o of [solid, wire, inside]) {
    if (!o) continue
    scene.remove(o)
    o.geometry?.dispose()
    o.material?.dispose()
  }
  solid = wire = inside = null
}

function showMesh(data) {
  initViewer()
  clearModel()
  $('empty').classList.add('hide')

  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(data.positions, 3))
  g.setAttribute('normal', new THREE.BufferAttribute(data.normals, 3))
  g.computeBoundingBox()

  // Centre on the origin so orbiting feels right whatever the part's origin.
  const c = new THREE.Vector3()
  g.boundingBox.getCenter(c)
  g.translate(-c.x, -c.y, -c.z)
  g.computeBoundingSphere()

  solid = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    // Mid grey, not near-white: a bright base clips its own highlights and
    // the form flattens out.
    color: 0x9aa6b2, metalness: 0.12, roughness: 0.46, flatShading: true,
    side: THREE.DoubleSide,
  }))
  scene.add(solid)

  inside = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0xa8714a, metalness: 0.05, roughness: 0.9,
    side: THREE.BackSide, flatShading: true,
  }))
  inside.visible = false
  scene.add(inside)

  wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(g),
    new THREE.LineBasicMaterial({ color: 0x8fa2b0, transparent: true, opacity: 0.3 }),
  )
  wire.visible = false
  scene.add(wire)

  setMode('shaded')
  applySection()
  fit()
}

function fit() {
  if (!solid) return
  const r = solid.geometry.boundingSphere.radius || 1
  const d = (r / Math.sin((camera.fov * Math.PI / 180) / 2)) * 1.3
  camera.position.set(d * 0.62, d * 0.44, d * 0.65)
  camera.near = r / 100
  camera.far = r * 100
  camera.updateProjectionMatrix()
  controls.target.set(0, 0, 0)
  controls.update()
}

function setMode(mode) {
  if (solid) solid.visible = mode === 'shaded'
  if (inside) inside.visible = mode === 'shaded' && sectioning
  if (wire) wire.visible = mode === 'wire'
  $('bShaded').setAttribute('aria-pressed', String(mode === 'shaded'))
  $('bWire').setAttribute('aria-pressed', String(mode === 'wire'))
}

function showImage(src, caption) {
  if (renderer) clearModel()
  const empty = $('empty')
  empty.classList.remove('hide')
  empty.innerHTML = ''
  const img = new Image()
  img.src = src
  img.alt = 'Preview image stored in the part'
  const p = document.createElement('span')
  p.textContent = caption
  empty.append(img, p)
}

function showMessage(title, detail) {
  if (renderer) clearModel()
  const empty = $('empty')
  empty.classList.remove('hide')
  empty.innerHTML = ''
  const h = document.createElement('strong')
  h.textContent = title
  const p = document.createElement('span')
  p.textContent = detail
  empty.append(h, p)
}

// ------------------------------------------------------------------ section

/* The cut runs across the part's own extent, so the slider always spans
   something useful whatever the part's size, and the readout is the real
   distance from the near face in millimetres. */
function cutRange() {
  if (!solid) return { lo: -1, hi: 1 }
  const b = solid.geometry.boundingBox
  const lo = [b.min.x, b.min.y, b.min.z][axis]
  const hi = [b.max.x, b.max.y, b.max.z][axis]
  return { lo, hi }
}

function applySection() {
  if (!solid) return
  const { lo, hi } = cutRange()
  const t = Number($('cut').value) / 1000
  const at = lo + (hi - lo) * t

  const normal = [0, 0, 0]
  normal[axis] = -1
  cutPlane.normal.set(normal[0], normal[1], normal[2])
  cutPlane.constant = at

  const planes = sectioning ? [cutPlane] : []
  for (const o of [solid, inside, wire]) {
    if (!o) continue
    o.material.clippingPlanes = planes
    o.material.clipShadows = true
    o.material.needsUpdate = true
  }
  if (inside) inside.visible = sectioning && solid.visible

  $('cutAt').textContent = sectioning
    ? `${(at - lo).toFixed(1)} mm of ${(hi - lo).toFixed(1)}`
    : ''
}

function setSection(on) {
  sectioning = on
  $('bSection').setAttribute('aria-pressed', String(on))
  $('sectionSet').classList.toggle('hide', !on)
  applySection()
}

// -------------------------------------------------------------------- snap

/* Snapping has to land on the model's own vertices and edges, not on the
   tessellation. A flat CAD face arrives as hundreds of triangles whose
   interior edges mean nothing, and snapping to those would be worse than not
   snapping at all. So the index keeps only feature edges: the ones where the
   two adjacent triangles disagree about which way the surface faces, plus
   open boundaries. It is the same test a wireframe uses to draw an outline.

   Built once per part, on the first measurement, because it costs a pass over
   every triangle and most sessions never measure. */

const SNAP_ANGLE = Math.cos((18 * Math.PI) / 180)  // a crease, not a curve
const SNAP_PIXELS = 14                             // how near the cursor must be
const GRID = 192                                   // cells across the part
const VERT_LIMIT = 2097152                         // ids have to pack into one number

const snap = {
  on: true, ready: false, tried: false,
  verts: null, edges: null, corners: null, cells: null,
  cell: 0, origin: null, count: 0, cornerCount: 0,
}

function clearSnapIndex() {
  snap.ready = snap.tried = false
  snap.verts = snap.edges = snap.corners = snap.cells = snap.origin = null
  snap.count = snap.cornerCount = 0
}

function cellKey(x, y, z) {
  return (x * 1024 + y) * 1024 + z
}

/* Merge vertices that arrived as separate copies in different triangles, so
   two triangles sharing an edge are seen to share it.

   Each axis is quantised to seventeen bits of the bounding box, which packs a
   position into one number a Map can key on: about three microns on a 400 mm
   part, far below anything a tessellator would call distinct. A string key is
   the obvious way to write this and cost eight seconds on a half-million-
   triangle assembly. */

const AXIS = 131072  // 2^17; three axes stay inside a double's 53 bits

function mergeVertices(pos, origin, span) {
  const step = (AXIS - 1) / span
  const lookup = new Map()
  const ids = new Int32Array(pos.length / 3)
  const verts = new Float32Array(pos.length)
  let next = 0

  for (let i = 0, v = 0; i < pos.length; i += 3, v++) {
    const key =
      (Math.round((pos[i] - origin.x) * step) * AXIS +
        Math.round((pos[i + 1] - origin.y) * step)) * AXIS +
      Math.round((pos[i + 2] - origin.z) * step)
    let id = lookup.get(key)
    if (id === undefined) {
      id = next++
      lookup.set(key, id)
      verts[id * 3] = pos[i]
      verts[id * 3 + 1] = pos[i + 1]
      verts[id * 3 + 2] = pos[i + 2]
    }
    ids[v] = id
  }
  // slice, not subarray: a view would hold the full-size buffer alive.
  return { ids, verts: verts.slice(0, next * 3) }
}

function faceNormals(pos) {
  const out = new Float32Array(pos.length / 3)
  for (let t = 0, o = 0; t < pos.length; t += 9, o += 3) {
    const ax = pos[t + 3] - pos[t], ay = pos[t + 4] - pos[t + 1], az = pos[t + 5] - pos[t + 2]
    const bx = pos[t + 6] - pos[t], by = pos[t + 7] - pos[t + 1], bz = pos[t + 8] - pos[t + 2]
    const x = ay * bz - az * by, y = az * bx - ax * bz, z = ax * by - ay * bx
    const len = Math.hypot(x, y, z) || 1
    out[o] = x / len; out[o + 1] = y / len; out[o + 2] = z / len
  }
  return out
}

/* A straight model edge arrives cut into segments, and every cut is an
   endpoint. Snapping to one gives a point that looks exact and sits on
   nothing in particular. A corner is where the feature edges meeting a point
   do not carry straight on through it: any count other than two, or two that
   turn. Only corners are offered as vertices. */

const STRAIGHT = Math.cos((10 * Math.PI) / 180)

function findCorners(verts, edges) {
  const count = new Uint8Array(verts.length / 3)
  const dirs = new Float32Array(verts.length * 2)  // room for two per vertex
  const corner = new Uint8Array(verts.length / 3)

  const note = (v, other) => {
    const o = other * 3
    const dx = verts[o] - verts[v * 3]
    const dy = verts[o + 1] - verts[v * 3 + 1]
    const dz = verts[o + 2] - verts[v * 3 + 2]
    const len = Math.hypot(dx, dy, dz) || 1
    const n = count[v]
    if (n < 2) {
      dirs[v * 6 + n * 3] = dx / len
      dirs[v * 6 + n * 3 + 1] = dy / len
      dirs[v * 6 + n * 3 + 2] = dz / len
    }
    // Three or more feature edges is a corner whatever the angles are.
    count[v] = Math.min(3, n + 1)
  }

  for (let e = 0; e < edges.length; e += 2) {
    const a = edges[e], b = edges[e + 1]
    note(a, b)
    note(b, a)
  }

  for (let v = 0; v < corner.length; v++) {
    if (count[v] === 0) continue
    if (count[v] !== 2) { corner[v] = 1; continue }
    // Two edges: a corner only if they turn. Collinear means the directions
    // point opposite ways, so the dot product sits at -1.
    const d =
      dirs[v * 6] * dirs[v * 6 + 3] +
      dirs[v * 6 + 1] * dirs[v * 6 + 4] +
      dirs[v * 6 + 2] * dirs[v * 6 + 5]
    if (d > -STRAIGHT) corner[v] = 1
  }
  return corner
}

function buildSnapIndex(geometry) {
  const pos = geometry.attributes.position.array
  geometry.computeBoundingBox()
  const box = geometry.boundingBox
  const size = box.getSize(new THREE.Vector3())
  const span = Math.max(size.x, size.y, size.z) || 1

  const merged = mergeVertices(pos, box.min, span)
  const verts = merged.verts, ids = merged.ids
  if (verts.length / 3 >= VERT_LIMIT) return false

  // An edge is held by the first triangle that claims it; the second one
  // decides whether it is a crease and releases it either way. Whatever is
  // still held at the end was claimed once, so it is an open boundary.
  const normals = faceNormals(pos)
  const pending = new Map()
  const edges = []

  const consider = (a, b, t) => {
    if (a === b) return
    const lo = a < b ? a : b, hi = a < b ? b : a
    const key = lo * VERT_LIMIT + hi
    const first = pending.get(key)
    if (first === undefined) { pending.set(key, t); return }
    pending.delete(key)
    const i = first * 3, j = t * 3
    const dot =
      normals[i] * normals[j] +
      normals[i + 1] * normals[j + 1] +
      normals[i + 2] * normals[j + 2]
    if (dot < SNAP_ANGLE) edges.push(lo, hi)
  }

  const triangles = ids.length / 3
  for (let t = 0; t < triangles; t++) {
    const a = ids[t * 3], b = ids[t * 3 + 1], c = ids[t * 3 + 2]
    consider(a, b, t); consider(b, c, t); consider(c, a, t)
  }
  for (const key of pending.keys()) {
    edges.push(Math.floor(key / VERT_LIMIT), key % VERT_LIMIT)
  }

  // A uniform grid, so a click tests a handful of edges rather than all of
  // them. Long edges are walked in half-cell steps: the middle of a 400 mm
  // rod has to be as findable as its ends.
  const cell = span / GRID
  const origin = box.min.clone()
  const cells = new Map()

  for (let e = 0; e < edges.length; e += 2) {
    const a = edges[e] * 3, b = edges[e + 1] * 3
    const dx = verts[b] - verts[a]
    const dy = verts[b + 1] - verts[a + 1]
    const dz = verts[b + 2] - verts[a + 2]
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy, dz) / (cell * 0.5)))
    let last = null
    for (let s = 0; s <= steps; s++) {
      const f = s / steps
      const key = cellKey(
        Math.floor((verts[a] + dx * f - origin.x) / cell),
        Math.floor((verts[a + 1] + dy * f - origin.y) / cell),
        Math.floor((verts[a + 2] + dz * f - origin.z) / cell),
      )
      if (key === last) continue
      last = key
      const bucket = cells.get(key)
      if (bucket) bucket.push(e)
      else cells.set(key, [e])
    }
  }

  snap.verts = verts
  snap.edges = Int32Array.from(edges)
  snap.corners = findCorners(verts, edges)
  snap.cornerCount = snap.corners.reduce((n, flag) => n + flag, 0)
  snap.cells = cells
  snap.cell = cell
  snap.origin = origin
  snap.count = edges.length / 2
  snap.ready = true
  return true
}

/* How many pixels one world unit covers at this depth, so the tolerance stays
   fourteen pixels whether the part fills the screen or sits far away. */
function pixelsPerUnit(point) {
  const rect = renderer.domElement.getBoundingClientRect()
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0)
  const a = point.clone().project(camera)
  const b = point.clone().add(right).project(camera)
  return Math.hypot((b.x - a.x) * rect.width, (b.y - a.y) * rect.height) / 2 || 1
}

const _a = new THREE.Vector3(), _b = new THREE.Vector3()
const _dir = new THREE.Vector3(), _rel = new THREE.Vector3()

/* The nearest vertex or feature edge to a surface hit, or the hit itself.
   A vertex beats any edge it sits on: it is the more specific answer, and the
   one a dimension is normally taken from. */
function snapTo(point) {
  if (!snap.on || !snap.ready) return { point, kind: 'surface' }

  const radius = SNAP_PIXELS / pixelsPerUnit(point)
  const reach = Math.min(8, Math.ceil(radius / snap.cell))
  const cx = Math.floor((point.x - snap.origin.x) / snap.cell)
  const cy = Math.floor((point.y - snap.origin.y) / snap.cell)
  const cz = Math.floor((point.z - snap.origin.z) / snap.cell)

  let vertex = null, vertexDist = radius
  let edge = null, edgeDist = radius
  const tested = new Set()

  for (let x = cx - reach; x <= cx + reach; x++) {
    for (let y = cy - reach; y <= cy + reach; y++) {
      for (let z = cz - reach; z <= cz + reach; z++) {
        const bucket = snap.cells.get(cellKey(x, y, z))
        if (!bucket) continue
        for (const e of bucket) {
          if (tested.has(e)) continue
          tested.add(e)

          const ia = snap.edges[e] * 3, ib = snap.edges[e + 1] * 3
          _a.set(snap.verts[ia], snap.verts[ia + 1], snap.verts[ia + 2])
          _b.set(snap.verts[ib], snap.verts[ib + 1], snap.verts[ib + 2])

          if (snap.corners[snap.edges[e]]) {
            const da = _a.distanceTo(point)
            if (da < vertexDist) { vertex = _a.clone(); vertexDist = da }
          }
          if (snap.corners[snap.edges[e + 1]]) {
            const db = _b.distanceTo(point)
            if (db < vertexDist) { vertex = _b.clone(); vertexDist = db }
          }

          // Closest point on the segment, clamped to its ends.
          _dir.subVectors(_b, _a)
          const len2 = _dir.lengthSq()
          if (!len2) continue
          _rel.subVectors(point, _a)
          const t = Math.min(1, Math.max(0, _rel.dot(_dir) / len2))
          const on = _a.clone().addScaledVector(_dir, t)
          const d = on.distanceTo(point)
          if (d < edgeDist) { edge = on; edgeDist = d }
        }
      }
    }
  }

  if (vertex) return { point: vertex, kind: 'vertex' }
  if (edge) return { point: edge, kind: 'edge' }
  return { point, kind: 'surface' }
}

/* The index is worth a second of work but not before it is wanted, and the
   hint has to paint before the main thread goes away to build it. */
const READY_HINT =
  'Click two points to measure between them. Vertices and edges snap; hold Alt for a free point.'

function ensureSnapIndex(done) {
  if (snap.ready || snap.tried || !solid) {
    showHint(READY_HINT)
    return done()
  }
  snap.tried = true
  showHint('Indexing edges for snapping…')
  setTimeout(() => {
    const started = performance.now()
    const ok = buildSnapIndex(solid.geometry)
    const ms = Math.round(performance.now() - started)
    console.log(
      ok
        ? `[snap] ${num(snap.count)} feature edges, ${num(snap.cornerCount)} corners, indexed in ${ms} ms`
        : '[snap] part too large to index; measuring free points',
    )
    showHint(READY_HINT)
    done()
  }, 30)
}

// ------------------------------------------------------------------ measure

function clearMeasure() {
  for (const m of measure3.markers) {
    scene?.remove(m)
    m.geometry.dispose()
    m.material.dispose()
  }
  if (measure3.line) {
    scene?.remove(measure3.line)
    measure3.line.geometry.dispose()
    measure3.line.material.dispose()
  }
  measure3.markers = []
  measure3.points = []
  measure3.kinds = []
  measure3.line = null
  $('caliper').classList.add('hide')
}

function setMeasure(on) {
  measure3.on = on
  $('bMeasure').setAttribute('aria-pressed', String(on))
  viewer.classList.toggle('measuring', on)
  if (!on) return clearMeasure(), showHint(null)
  // Pay for the index now rather than swallowing the first click with it.
  ensureSnapIndex(() => {})
}

function showHint(text) {
  const el = $('hint')
  if (!text) return el.classList.add('hide')
  el.textContent = text
  el.classList.remove('hide')
}

const MARKER_COLOUR = { vertex: 0x5fd3a6, edge: 0x5fd3a6, surface: 0xe0a33e }

function addMarker(point, kind) {
  const r = (solid?.geometry.boundingSphere?.radius ?? 10) * 0.014
  const dot = new THREE.Mesh(
    // A snapped point is exact and gets a crisp octahedron; a free point on a
    // face is approximate and stays a soft sphere, so the marker itself says
    // how much the number can be trusted.
    kind === 'surface'
      ? new THREE.SphereGeometry(r, 16, 12)
      : new THREE.OctahedronGeometry(r * 1.35),
    new THREE.MeshBasicMaterial({ color: MARKER_COLOUR[kind] ?? 0x5fd3a6, depthTest: false }),
  )
  dot.renderOrder = 10
  dot.position.copy(point)
  scene.add(dot)
  measure3.markers.push(dot)
}

function drawSpan() {
  const [a, b] = measure3.points
  const geometry = new THREE.BufferGeometry().setFromPoints([a, b])
  const exact = measure3.kinds.every((k) => k !== 'surface')
  measure3.line = new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({
      color: exact ? 0x5fd3a6 : 0xe0a33e,
      depthTest: false,
    }),
  )
  measure3.line.renderOrder = 9
  scene.add(measure3.line)
  const kinds = measure3.kinds
  showHint(
    exact
      ? kinds.join(' to ') + '. Click again to start a new measurement.'
      : 'One end is a point on a face, so this is approximate. Click again to restart.',
  )
}

function pickPoint(event) {
  if (!solid) return null
  const rect = renderer.domElement.getBoundingClientRect()
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1
  raycaster.setFromCamera(pointer, camera)
  // Clipped-away geometry is still real to a raycaster, so a section view
  // would otherwise let you measure to a face you cannot see.
  const hits = raycaster.intersectObject(solid, false)
  for (const hit of hits) {
    if (!sectioning || cutPlane.distanceToPoint(hit.point) >= 0) {
      return snapTo(hit.point.clone())
    }
  }
  return null
}

const SNAP_NOTE = {
  vertex: 'Snapped to a vertex.',
  edge: 'Snapped to an edge.',
  surface: 'Point on a face.',
}

function onMeasureClick(event) {
  if (!measure3.on) return
  // Alt is the usual way out of a snap when the point wanted is on the face
  // between two edges.
  snap.on = !event.altKey
  ensureSnapIndex(() => takeMeasurePoint(event))
}

function takeMeasurePoint(event) {
  const hit = pickPoint(event)
  if (!hit) return showHint('No surface there. Click on the part.')

  if (measure3.points.length >= 2) clearMeasure()
  measure3.points.push(hit.point)
  measure3.kinds.push(hit.kind)
  addMarker(hit.point, hit.kind)

  if (measure3.points.length === 2) {
    drawSpan()
  } else {
    showHint(SNAP_NOTE[hit.kind] + ' Click a second point.')
  }
  updateCaliper()
}

/* The label tracks the midpoint of the span in screen space, so it stays on
   the dimension while the part is orbited. */
function updateCaliper() {
  const el = $('caliper')
  if (measure3.points.length !== 2 || !renderer) return el.classList.add('hide')

  const [a, b] = measure3.points
  const mid = a.clone().add(b).multiplyScalar(0.5).project(camera)
  const rect = renderer.domElement.getBoundingClientRect()

  const approximate = measure3.kinds.includes('surface')
  el.textContent = `${approximate ? '~' : ''}${a.distanceTo(b).toFixed(2)} mm`
  el.classList.toggle('loose', approximate)
  el.style.left = `${(mid.x * 0.5 + 0.5) * rect.width}px`
  el.style.top = `${(-mid.y * 0.5 + 0.5) * rect.height}px`
  el.classList.remove('hide')
}

// ----------------------------------------------------------------- readout

function measure(label, value, tone) {
  if (value === null || value === undefined || value === '') return ''
  const cls = tone ? ` is-${tone}` : ''
  return `<div class="measure${cls}"><dt>${esc(label)}</dt><dd>${value}</dd></div>`
}

function renderReadout() {
  const box = $('measures')
  const it = parts[active]

  if (!it) {
    box.innerHTML = '<p class="listing">Measurements appear here once a part is read.</p>'
    return
  }
  if (it.state === 'reading') {
    box.innerHTML = `<p class="listing">Reading ${esc(it.name)}…</p>`
    return
  }
  if (it.state === 'failed') {
    box.innerHTML = `<div class="verdict"><b>Could not read this file</b>${esc(it.error)}</div>`
    return
  }

  const info = it.info
  let html = ''

  if (it.report) {
    const r = it.report
    const d = r.dimensions_mm
    const closed = r.open_edges === 0

    html += `<dl class="headline"><dd>${num(r.triangles)}</dd><dt>triangles</dt></dl>`
    html += measure('Vertices', num(r.vertices))
    if (d) {
      html += measure('Width', `${d[0].toFixed(2)}<u> mm</u>`)
      html += measure('Height', `${d[1].toFixed(2)}<u> mm</u>`)
      html += measure('Depth', `${d[2].toFixed(2)}<u> mm</u>`)
    }
    html += measure('Open edges', num(r.open_edges), closed ? 'pass' : 'flag')
    if (r.volume_mm3 != null) {
      html += measure('Volume',
        `${r.volume_mm3.toLocaleString('en-GB', { maximumFractionDigits: 0 })}<u> mm³</u>`)
    }
    if (info?.shells != null) html += measure('Shells', num(info.shells))
  }

  if (info) {
    if (info.blocks_verified != null) {
      const all = info.blocks_verified === info.block_count
      html += measure('Blocks checked', `${info.blocks_verified} / ${info.block_count}`,
        all ? 'pass' : 'flag')
    }
    if (info.material) html += measure('Material', esc(info.material))
    if (info.assembly) {
      const a = info.assembly
      html += measure('Components', `${a.placed} / ${a.references}`, a.complete ? 'pass' : 'flag')
      if (a.configurations.length > 1) {
        html += measure('Configuration', `${esc(a.configuration)} <u>of ${a.configurations.length}</u>`)
      }
    }
  }
  html += measure('File', fmtB(it.size))

  if (info?.assembly && !info.assembly.complete) {
    html += `<div class="verdict"><b>Partial assembly</b>${esc(info.assembly.summary)}. SolidWorks caches a mesh only for some components, so the rest are not in this file.</div>`
  }

  if (it.report) {
    html += it.report.open_edges === 0
      ? '<div class="verdict good"><b>Watertight</b>Every edge is shared by two triangles. Ready to slice.</div>'
      : `<div class="verdict"><b>${num(it.report.open_edges)} open edges</b>Most slicers will want this repaired before printing.</div>`
  } else {
    html += '<div class="verdict"><b>No saved mesh</b>This part stores only B-rep surfaces, so there is no geometry to export.</div>'
  }

  if (info?.components?.length) {
    html += `<div class="listing"><h3>References ${info.components.length}</h3><ul>`
      + info.components.slice(0, 12).map((c) => `<li>${esc(c)}</li>`).join('')
      + '</ul></div>'
  }
  if (info?.standards?.length) {
    html += '<div class="listing"><h3>Standards</h3><ul>'
      + info.standards.map((c) => `<li>${esc(c)}</li>`).join('') + '</ul></div>'
  }

  box.innerHTML = html
}

function renderQueue() {
  $('count').textContent = parts.length ? String(parts.length) : ''
  $('queue').innerHTML = parts.map((p, i) => `
    <button class="part" data-i="${i}" data-state="${p.state}" aria-current="${i === active}">
      <b>${esc(p.name)}</b>
      <i>${esc(p.note)}</i>
      <span class="remove" role="button" tabindex="0" data-remove="${i}"
            aria-label="Remove ${esc(p.name)}">&#10005;</span>
    </button>`).join('')

  for (const el of $('queue').querySelectorAll('.part')) {
    el.onclick = (e) => {
      if (e.target.dataset.remove !== undefined) return
      select(Number(el.dataset.i))
    }
  }
  for (const el of $('queue').querySelectorAll('[data-remove]')) {
    el.onclick = (e) => { e.stopPropagation(); remove(Number(el.dataset.remove)) }
    el.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault()
        e.stopPropagation()
        remove(Number(el.dataset.remove))
      }
    }
  }
}

const EMPTY_TITLE = 'No part loaded'
const EMPTY_BODY = 'Drop a SolidWorks part to read its geometry and export a mesh.'

function select(i) {
  active = i
  const it = parts[i]
  renderQueue()
  renderReadout()

  const hasMesh = !!(it && it.mesh)
  $('bStl').disabled = $('bMf').disabled = !hasMesh

  if (!it) return showMessage(EMPTY_TITLE, EMPTY_BODY)
  if (it.state === 'reading') return showMessage('Reading…', it.name)
  if (it.state === 'failed') return showMessage('Could not read this file', it.error)
  if (hasMesh) {
    showMesh(it.mesh)
    if (measure3.on) showHint('Click two points on the part to measure between them.')
    return
  }
  if (it.info?.preview) return showImage(it.info.preview, 'Preview stored in the part. No mesh to display.')
  showMessage('No geometry', 'This part stores no saved mesh, so there is nothing to display.')
}

function remove(i) {
  parts.splice(i, 1)
  if (!parts.length) {
    active = -1
    renderQueue()
    renderReadout()
    $('bStl').disabled = $('bMf').disabled = true
    return showMessage(EMPTY_TITLE, EMPTY_BODY)
  }
  select(Math.min(i, parts.length - 1))
}

// ------------------------------------------------------------------ intake

/* Geometry arrives as: uint32 header length, JSON header, then positions and
   normals as raw float32. Float32Array views the buffer directly, so nothing
   is parsed and nothing is copied. */
function decodeMesh(buf) {
  const view = new DataView(buf)
  const headerLen = view.getUint32(0, true)
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)))
  const start = 4 + headerLen
  const n = header.floats
  return {
    name: header.name,
    report: header.report,
    positions: new Float32Array(buf, start, n),
    normals: new Float32Array(buf, start + n * 4, n),
  }
}

async function detail(response) {
  try { return (await response.json()).detail } catch { return response.statusText }
}

async function post(path, file, companions) {
  const body = new FormData()
  body.append('file', file)
  for (const c of companions || []) body.append('companion', c)
  return fetch(path, { method: 'POST', body })
}

// An assembly names its components by file name and caches a mesh for only
// some of them. Drop the parts in with it and the rest can be read from
// their own files.
const PART_EXT = /\.(sldprt|sldasm)$/i

function companionsFor(file, batch) {
  if (!/\.sldasm$/i.test(file.name)) return []
  return (batch || []).filter((f) => f !== file && PART_EXT.test(f.name))
}

async function intake(file, batch) {
  const ext = file.name.toLowerCase().split('.').pop()
  const companions = companionsFor(file, batch)
  const entry = { name: file.name, size: file.size, state: 'reading', note: 'reading…', file, companions }
  parts.push(entry)
  select(parts.length - 1)

  try {
    if (ext === 'sldprt' || ext === 'sldasm') {
      const r = await post('/api/inspect', file, companions)
      if (!r.ok) throw new Error(await detail(r))
      entry.info = await r.json()

      // A part carrying a saved mesh is real geometry, so show it rather
      // than stopping at the stored preview image.
      if (entry.info.has_saved_mesh) {
        const m = await post('/api/mesh', file, companions)
        if (m.ok) entry.mesh = decodeMesh(await m.arrayBuffer())
      }
    } else {
      const r = await post('/api/mesh', file, companions)
      if (!r.ok) throw new Error(await detail(r))
      entry.mesh = decodeMesh(await r.arrayBuffer())
    }

    entry.state = 'read'
    entry.report = entry.mesh ? entry.mesh.report : null
    // "No saved mesh" is a claim about a file that was read. A file with no
    // blocks at all was not read, and saying otherwise is how this reader got
    // its worst answer wrong once already.
    entry.note = entry.report
      ? `${num(entry.report.triangles)} triangles`
      : entry.info && !entry.info.block_count
        ? 'not a SolidWorks container'
        : 'no saved mesh'
  } catch (err) {
    entry.state = 'failed'
    entry.error = err.message
    entry.note = 'could not be read'
  }

  // The part may have been removed while it was being read.
  const at = parts.indexOf(entry)
  if (at >= 0) select(at)
}

async function exportAs(fmt) {
  const it = parts[active]
  if (!it?.mesh) return
  const r = await post(`/api/convert?fmt=${fmt}`, it.file, it.companions)
  if (!r.ok) return
  const url = URL.createObjectURL(await r.blob())
  const a = document.createElement('a')
  a.href = url
  a.download = it.name.replace(/\.[^.]+$/, '') + '.' + fmt
  a.click()
  URL.revokeObjectURL(url)
}

// ------------------------------------------------------------------ wiring

const drop = $('drop'), picker = $('picker')
drop.onclick = () => picker.click()
drop.onkeydown = (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click() }
}
picker.onchange = () => {
  const batch = [...picker.files]
  for (const f of batch) intake(f, batch)
  picker.value = ''
}

// The whole window accepts a drop; both the rail target and the viewer show
// it, since either is a reasonable place to aim.
const targets = [drop, viewer]
const markDrop = (on) => targets.forEach((t) => t.classList.toggle('over', on))

for (const ev of ['dragenter', 'dragover']) {
  document.addEventListener(ev, (e) => { e.preventDefault(); markDrop(true) })
}
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) markDrop(false) })
document.addEventListener('drop', (e) => {
  e.preventDefault()
  markDrop(false)
  const batch = [...e.dataTransfer.files]
  for (const f of batch) intake(f, batch)
})

// The empty viewer is the primary target, so clicking it opens the picker.
$('empty').onclick = () => { if (!parts.length || !parts[active]?.mesh) picker.click() }

$('bShaded').onclick = () => setMode('shaded')
$('bWire').onclick = () => setMode('wire')
$('bFit').onclick = fit

$('bSection').onclick = () => setSection(!sectioning)
$('cut').oninput = applySection
$('bAxis').onclick = () => {
  axis = (axis + 1) % 3
  $('bAxis').textContent = AXES[axis]
  applySection()
}
$('bMeasure').onclick = () => setMeasure(!measure3.on)

// Escape clears a measurement in progress without leaving measure mode.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (measure3.points.length) { clearMeasure(); showHint('Click two points on the part to measure between them.') }
  else if (measure3.on) setMeasure(false)
})
$('bStl').onclick = () => exportAs('stl')
$('bMf').onclick = () => exportAs('3mf')

renderQueue()
renderReadout()
</script>
</body>
</html>
