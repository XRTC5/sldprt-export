<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sldprt-export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  /* An inspection bench, not a viewer. The user's real question is whether
     the part converted correctly and whether it will print, so the
     measurements carry the typographic weight and the geometry gets the
     space. Structure comes from hairline rules and a shared number axis
     rather than from cards. */
  :root {
    --bench:       #1b1f24;   /* anodised graphite ground */
    --bench-deep:  #14181c;   /* the viewer well, recessed */
    --bench-raise: #222830;   /* the one raised surface: the parts rail */
    --rule:        #2c333b;
    --rule-strong: #3d4650;
    --ink:         #e9edf0;
    --ink-soft:    #8d99a4;
    --ink-faint:   #5d6872;
    --pass:        #5fd3a6;   /* verified, watertight */
    --flag:        #e0a33e;   /* needs attention */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bench);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums lining-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- frame */

  .bench {
    display: grid;
    grid-template-columns: 252px minmax(0, 1fr) 268px;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
  }

  .masthead {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 1.15rem 1.5rem 1rem;
    border-bottom: 1px solid var(--rule);
  }

  .masthead h1 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.012em;
  }

  .masthead p { margin: 0; color: var(--ink-soft); }

  .masthead .local {
    margin-left: auto;
    color: var(--ink-faint);
    font-size: 0.8125rem;
  }

  /* -------------------------------------------------------- parts rail */

  .rail {
    background: var(--bench-raise);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 1rem 1.1rem 0.7rem;
    color: var(--ink-soft);
  }

  .rail-head span:last-child { color: var(--ink-faint); }

  .queue { overflow-y: auto; flex: 1; min-height: 0; }

  .part {
    position: relative;
    width: 100%;
    display: block;
    text-align: left;
    padding: 0.7rem 2.4rem 0.75rem 1.1rem;
    background: none;
    border: 0;
    border-top: 1px solid var(--rule);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .part:last-child { border-bottom: 1px solid var(--rule); }
  .part:hover { background: #262d36; }

  .part[aria-current='true'] {
    background: #262d36;
    box-shadow: inset 2px 0 0 var(--pass);
  }

  .part b { display: block; font-weight: 500; overflow-wrap: anywhere; }

  .part i {
    font-style: normal;
    color: var(--ink-soft);
    font-size: 0.8125rem;
  }

  .part[data-state='failed'] i { color: var(--flag); }

  .remove {
    position: absolute;
    top: 50%;
    right: 0.55rem;
    translate: 0 -50%;
    width: 1.7rem;
    height: 1.7rem;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--ink-faint);
    cursor: pointer;
    opacity: 0;
  }

  .part:hover .remove, .remove:focus-visible { opacity: 1; }
  .remove:hover { background: #333c47; color: var(--ink); }

  .drop {
    margin: 0.9rem 1.1rem 1.1rem;
    padding: 1.15rem 0.9rem;
    border: 1px dashed var(--rule-strong);
    border-radius: 4px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  .drop:hover, .drop.over { border-color: var(--pass); color: var(--ink); }
  .drop b { display: block; font-weight: 500; color: var(--ink); }
  .drop small { font-size: 0.8125rem; }

  input[type='file'] { display: none; }

  /* ------------------------------------------------------------ viewer */

  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Graph paper: a fine grid with a heavier line every fifth, the way a
     drawing sheet or a machine bed is ruled. It gives the part a surface to
     sit on and a sense of scale that a flat void does not. */
  .viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      linear-gradient(to right, rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
      linear-gradient(to bottom, rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
      linear-gradient(to right, rgba(255, 255, 255, 0.10) 1px, transparent 1px) 0 0 / 150px 150px,
      linear-gradient(to bottom, rgba(255, 255, 255, 0.10) 1px, transparent 1px) 0 0 / 150px 150px,
      radial-gradient(ellipse at 50% 45%, #202730 0%, #0f1317 78%);
  }

  /* The grid should fade at the edges so it frames rather than competes. */
  .viewer::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, #0f1317 96%);
  }

  .viewer.over::before {
    content: '';
    position: absolute;
    inset: 10px;
    z-index: 2;
    border: 2px dashed var(--pass);
    border-radius: 6px;
    pointer-events: none;
  }

  .viewer canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

  /* With nothing loaded the whole viewer is the drop target. Reading a part
     is the point of the tool, so the invitation gets the largest surface
     rather than a box tucked into the sidebar. */
  .empty {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 0.6rem;
    padding: 2rem;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .empty strong {
    font-size: 1.75rem;
    font-weight: 450;
    letter-spacing: -0.015em;
    color: var(--ink);
  }

  .empty span { max-width: 34ch; }

  .empty kbd {
    margin-top: 0.4rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font: inherit;
    color: var(--ink);
  }

  .empty:hover kbd { border-color: var(--pass); }

  .empty img {
    max-width: min(520px, 100%);
    max-height: 48vh;
    border-radius: 3px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1rem;
    border-top: 1px solid var(--rule);
  }

  .controls .spacer { flex: 1; }

  button.tool {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    cursor: pointer;
  }

  button.tool:hover:not(:disabled) { color: var(--ink); border-color: #4c5762; }
  button.tool[aria-pressed='true'] { background: #313a44; color: var(--ink); }
  button.tool:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Export is what the tool is for, so it is the largest control on the
     bench and the only filled one. */
  button.export {
    padding: 0.6rem 1.35rem;
    border: 1px solid transparent;
    border-radius: 4px;
    background: var(--pass);
    color: #10201a;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
  }

  button.export:hover:not(:disabled) { background: #77e0b8; }

  button.export.secondary {
    background: transparent;
    border-color: var(--pass);
    color: var(--pass);
  }

  button.export.secondary:hover:not(:disabled) { background: rgba(95, 211, 166, 0.12); }

  button.export:disabled {
    background: transparent;
    border-color: var(--rule);
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  :focus-visible { outline: 2px solid var(--pass); outline-offset: 2px; }

  /* ----------------------------------------------------------- readout */

  .readout {
    border-left: 1px solid var(--rule);
    overflow-y: auto;
    min-height: 0;
    padding-bottom: 1.5rem;
  }

  .readout h2 {
    margin: 0;
    padding: 1rem 1.1rem 0.7rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .measure {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 1.1rem;
    border-top: 1px solid var(--rule);
  }

  .measure dt { color: var(--ink-soft); }
  .measure dd { margin: 0; font-weight: 500; }
  .measure dd u { text-decoration: none; color: var(--ink-faint); }
  .measure.is-pass dd { color: var(--pass); }
  .measure.is-flag dd { color: var(--flag); }

  /* The headline figure: the one number the whole page exists to produce. */
  .headline { padding: 0.9rem 1.1rem 1rem; border-top: 1px solid var(--rule); }

  .headline dd {
    margin: 0;
    font-size: 2.125rem;
    font-weight: 450;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .headline dt { color: var(--ink-soft); }

  .verdict {
    margin: 0.9rem 1.1rem 0;
    padding: 0.7rem 0.8rem;
    border-left: 2px solid var(--flag);
    background: #23262a;
    color: var(--ink-soft);
    font-size: 0.8125rem;
  }

  .verdict.good { border-left-color: var(--pass); }
  .verdict b { display: block; color: var(--ink); font-weight: 500; }

  .listing { margin: 0.9rem 1.1rem 0; color: var(--ink-soft); font-size: 0.8125rem; }

  .listing h3 {
    margin: 0 0 0.3rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ink);
  }

  .listing ul { margin: 0 0 0.9rem; padding-left: 1rem; }
  .listing li { overflow-wrap: anywhere; }

  .hide { display: none !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 1080px) {
    .bench {
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: auto minmax(340px, 1fr) auto;
      height: auto;
      min-height: 100vh;
    }
    .readout { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); }
  }

  @media (max-width: 720px) {
    .bench { grid-template-columns: minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--rule); }
    .masthead { flex-wrap: wrap; }
    .masthead .local { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="bench">
  <header class="masthead">
    <h1>sldprt-export</h1>
    <p>Reads SolidWorks parts without SolidWorks</p>
    <span class="local">Runs on this machine. Nothing is uploaded.</span>
  </header>

  <div class="rail">
    <div class="rail-head">
      <span>Parts</span>
      <span id="count"></span>
    </div>
    <div class="queue" id="queue"></div>
    <div class="drop" id="drop" tabindex="0" role="button">
      <b>Drop a part</b>
      <small>.sldprt .sldasm .stl .3mf .obj</small>
    </div>
    <input type="file" id="picker" multiple accept=".sldprt,.sldasm,.stl,.3mf,.obj">
  </div>

  <div class="stage">
    <div class="viewer" id="viewer">
      <div class="empty" id="empty">
        <strong>Drop a part here</strong>
        <span>Reads the geometry out of a SolidWorks file and exports it as a mesh.</span>
        <kbd>.sldprt .sldasm .stl .3mf .obj</kbd>
      </div>
    </div>
    <div class="controls">
      <button class="tool" id="bShaded" aria-pressed="true">Shaded</button>
      <button class="tool" id="bWire" aria-pressed="false">Wireframe</button>
      <button class="tool" id="bFit">Fit</button>
      <span class="spacer"></span>
      <button class="export" id="bStl" disabled>Export STL</button>
      <button class="export secondary" id="bMf" disabled>Export 3MF</button>
    </div>
  </div>

  <div class="readout" id="readout">
    <h2>Measurements</h2>
    <div id="measures"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

const $ = (id) => document.getElementById(id)
const parts = []
let active = -1

const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmtB = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                  : n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B'
const num = (n) => n.toLocaleString('en-GB')

// ------------------------------------------------------------------ viewer

const viewer = $('viewer')
let renderer, scene, camera, controls, solid, wire

function initViewer() {
  if (renderer) return
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
  viewer.appendChild(renderer.domElement)

  scene = new THREE.Scene()
  camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100000)
  controls = new OrbitControls(camera, renderer.domElement)
  controls.enableDamping = true

  /* Three lights doing three jobs. A flat grey part on a dark ground reads
     as a silhouette with no form, so: a key to model the surface, a cool
     hemisphere so the shadow side stays legible instead of going black, and
     a rim from behind to separate the part from the background. */
  scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x39424c, 1.15))

  const key = new THREE.DirectionalLight(0xfff4e6, 2.1)
  key.position.set(1.0, 1.25, 0.85)
  scene.add(key)

  const fill = new THREE.DirectionalLight(0xc8dcec, 0.7)
  fill.position.set(-1.1, -0.25, 0.6)
  scene.add(fill)

  const rim = new THREE.DirectionalLight(0xffffff, 1.5)
  rim.position.set(-0.5, 0.6, -1.3)
  scene.add(rim)

  resize()
  new ResizeObserver(resize).observe(viewer)
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera) })
}

function resize() {
  if (!renderer) return
  const w = viewer.clientWidth, h = viewer.clientHeight || 420
  renderer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}

function clearModel() {
  for (const o of [solid, wire]) {
    if (!o) continue
    scene.remove(o)
    o.geometry?.dispose()
    o.material?.dispose()
  }
  solid = wire = null
}

function showMesh(data) {
  initViewer()
  clearModel()
  $('empty').classList.add('hide')

  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(data.positions, 3))
  g.setAttribute('normal', new THREE.BufferAttribute(data.normals, 3))
  g.computeBoundingBox()

  // Centre on the origin so orbiting feels right whatever the part's origin.
  const c = new THREE.Vector3()
  g.boundingBox.getCenter(c)
  g.translate(-c.x, -c.y, -c.z)
  g.computeBoundingSphere()

  solid = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    // Mid grey, not near-white: a bright base clips its own highlights and
    // the form flattens out.
    color: 0x9aa6b2, metalness: 0.12, roughness: 0.46, flatShading: true,
    side: THREE.DoubleSide,
  }))
  scene.add(solid)

  wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(g),
    new THREE.LineBasicMaterial({ color: 0x8fa2b0, transparent: true, opacity: 0.3 }),
  )
  wire.visible = false
  scene.add(wire)

  setMode('shaded')
  fit()
}

function fit() {
  if (!solid) return
  const r = solid.geometry.boundingSphere.radius || 1
  const d = (r / Math.sin((camera.fov * Math.PI / 180) / 2)) * 1.3
  camera.position.set(d * 0.62, d * 0.44, d * 0.65)
  camera.near = r / 100
  camera.far = r * 100
  camera.updateProjectionMatrix()
  controls.target.set(0, 0, 0)
  controls.update()
}

function setMode(mode) {
  if (solid) solid.visible = mode === 'shaded'
  if (wire) wire.visible = mode === 'wire'
  $('bShaded').setAttribute('aria-pressed', String(mode === 'shaded'))
  $('bWire').setAttribute('aria-pressed', String(mode === 'wire'))
}

function showImage(src, caption) {
  if (renderer) clearModel()
  const empty = $('empty')
  empty.classList.remove('hide')
  empty.innerHTML = ''
  const img = new Image()
  img.src = src
  img.alt = 'Preview image stored in the part'
  const p = document.createElement('span')
  p.textContent = caption
  empty.append(img, p)
}

function showMessage(title, detail) {
  if (renderer) clearModel()
  const empty = $('empty')
  empty.classList.remove('hide')
  empty.innerHTML = ''
  const h = document.createElement('strong')
  h.textContent = title
  const p = document.createElement('span')
  p.textContent = detail
  empty.append(h, p)
}

// ----------------------------------------------------------------- readout

function measure(label, value, tone) {
  if (value === null || value === undefined || value === '') return ''
  const cls = tone ? ` is-${tone}` : ''
  return `<div class="measure${cls}"><dt>${esc(label)}</dt><dd>${value}</dd></div>`
}

function renderReadout() {
  const box = $('measures')
  const it = parts[active]

  if (!it) {
    box.innerHTML = '<p class="listing">Measurements appear here once a part is read.</p>'
    return
  }
  if (it.state === 'reading') {
    box.innerHTML = `<p class="listing">Reading ${esc(it.name)}…</p>`
    return
  }
  if (it.state === 'failed') {
    box.innerHTML = `<div class="verdict"><b>Could not read this file</b>${esc(it.error)}</div>`
    return
  }

  const info = it.info
  let html = ''

  if (it.report) {
    const r = it.report
    const d = r.dimensions_mm
    const closed = r.open_edges === 0

    html += `<dl class="headline"><dd>${num(r.triangles)}</dd><dt>triangles</dt></dl>`
    html += measure('Vertices', num(r.vertices))
    if (d) {
      html += measure('Width', `${d[0].toFixed(2)}<u> mm</u>`)
      html += measure('Height', `${d[1].toFixed(2)}<u> mm</u>`)
      html += measure('Depth', `${d[2].toFixed(2)}<u> mm</u>`)
    }
    html += measure('Open edges', num(r.open_edges), closed ? 'pass' : 'flag')
    if (r.volume_mm3 != null) {
      html += measure('Volume',
        `${r.volume_mm3.toLocaleString('en-GB', { maximumFractionDigits: 0 })}<u> mm³</u>`)
    }
    if (info?.shells != null) html += measure('Shells', num(info.shells))
  }

  if (info) {
    if (info.blocks_verified != null) {
      const all = info.blocks_verified === info.block_count
      html += measure('Blocks checked', `${info.blocks_verified} / ${info.block_count}`,
        all ? 'pass' : 'flag')
    }
    if (info.material) html += measure('Material', esc(info.material))
  }
  html += measure('File', fmtB(it.size))

  if (it.report) {
    html += it.report.open_edges === 0
      ? '<div class="verdict good"><b>Watertight</b>Every edge is shared by two triangles. Ready to slice.</div>'
      : `<div class="verdict"><b>${num(it.report.open_edges)} open edges</b>Most slicers will want this repaired before printing.</div>`
  } else {
    html += '<div class="verdict"><b>No saved mesh</b>This part stores only B-rep surfaces, so there is no geometry to export.</div>'
  }

  if (info?.components?.length) {
    html += `<div class="listing"><h3>References ${info.components.length}</h3><ul>`
      + info.components.slice(0, 12).map((c) => `<li>${esc(c)}</li>`).join('')
      + '</ul></div>'
  }
  if (info?.standards?.length) {
    html += '<div class="listing"><h3>Standards</h3><ul>'
      + info.standards.map((c) => `<li>${esc(c)}</li>`).join('') + '</ul></div>'
  }

  box.innerHTML = html
}

function renderQueue() {
  $('count').textContent = parts.length ? String(parts.length) : ''
  $('queue').innerHTML = parts.map((p, i) => `
    <button class="part" data-i="${i}" data-state="${p.state}" aria-current="${i === active}">
      <b>${esc(p.name)}</b>
      <i>${esc(p.note)}</i>
      <span class="remove" role="button" tabindex="0" data-remove="${i}"
            aria-label="Remove ${esc(p.name)}">&#10005;</span>
    </button>`).join('')

  for (const el of $('queue').querySelectorAll('.part')) {
    el.onclick = (e) => {
      if (e.target.dataset.remove !== undefined) return
      select(Number(el.dataset.i))
    }
  }
  for (const el of $('queue').querySelectorAll('[data-remove]')) {
    el.onclick = (e) => { e.stopPropagation(); remove(Number(el.dataset.remove)) }
    el.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault()
        e.stopPropagation()
        remove(Number(el.dataset.remove))
      }
    }
  }
}

const EMPTY_TITLE = 'No part loaded'
const EMPTY_BODY = 'Drop a SolidWorks part to read its geometry and export a mesh.'

function select(i) {
  active = i
  const it = parts[i]
  renderQueue()
  renderReadout()

  const hasMesh = !!(it && it.mesh)
  $('bStl').disabled = $('bMf').disabled = !hasMesh

  if (!it) return showMessage(EMPTY_TITLE, EMPTY_BODY)
  if (it.state === 'reading') return showMessage('Reading…', it.name)
  if (it.state === 'failed') return showMessage('Could not read this file', it.error)
  if (hasMesh) return showMesh(it.mesh)
  if (it.info?.preview) return showImage(it.info.preview, 'Preview stored in the part. No mesh to display.')
  showMessage('No geometry', 'This part stores no saved mesh, so there is nothing to display.')
}

function remove(i) {
  parts.splice(i, 1)
  if (!parts.length) {
    active = -1
    renderQueue()
    renderReadout()
    $('bStl').disabled = $('bMf').disabled = true
    return showMessage(EMPTY_TITLE, EMPTY_BODY)
  }
  select(Math.min(i, parts.length - 1))
}

// ------------------------------------------------------------------ intake

/* Geometry arrives as: uint32 header length, JSON header, then positions and
   normals as raw float32. Float32Array views the buffer directly, so nothing
   is parsed and nothing is copied. */
function decodeMesh(buf) {
  const view = new DataView(buf)
  const headerLen = view.getUint32(0, true)
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)))
  const start = 4 + headerLen
  const n = header.floats
  return {
    name: header.name,
    report: header.report,
    positions: new Float32Array(buf, start, n),
    normals: new Float32Array(buf, start + n * 4, n),
  }
}

async function detail(response) {
  try { return (await response.json()).detail } catch { return response.statusText }
}

async function post(path, file) {
  const body = new FormData()
  body.append('file', file)
  return fetch(path, { method: 'POST', body })
}

async function intake(file) {
  const ext = file.name.toLowerCase().split('.').pop()
  const entry = { name: file.name, size: file.size, state: 'reading', note: 'reading…', file }
  parts.push(entry)
  select(parts.length - 1)

  try {
    if (ext === 'sldprt' || ext === 'sldasm') {
      const r = await post('/api/inspect', file)
      if (!r.ok) throw new Error(await detail(r))
      entry.info = await r.json()

      // A part carrying a saved mesh is real geometry, so show it rather
      // than stopping at the stored preview image.
      if (entry.info.has_saved_mesh) {
        const m = await post('/api/mesh', file)
        if (m.ok) entry.mesh = decodeMesh(await m.arrayBuffer())
      }
    } else {
      const r = await post('/api/mesh', file)
      if (!r.ok) throw new Error(await detail(r))
      entry.mesh = decodeMesh(await r.arrayBuffer())
    }

    entry.state = 'read'
    entry.report = entry.mesh ? entry.mesh.report : null
    entry.note = entry.report ? `${num(entry.report.triangles)} triangles` : 'no saved mesh'
  } catch (err) {
    entry.state = 'failed'
    entry.error = err.message
    entry.note = 'could not be read'
  }

  // The part may have been removed while it was being read.
  const at = parts.indexOf(entry)
  if (at >= 0) select(at)
}

async function exportAs(fmt) {
  const it = parts[active]
  if (!it?.mesh) return
  const r = await post(`/api/convert?fmt=${fmt}`, it.file)
  if (!r.ok) return
  const url = URL.createObjectURL(await r.blob())
  const a = document.createElement('a')
  a.href = url
  a.download = it.name.replace(/\.[^.]+$/, '') + '.' + fmt
  a.click()
  URL.revokeObjectURL(url)
}

// ------------------------------------------------------------------ wiring

const drop = $('drop'), picker = $('picker')
drop.onclick = () => picker.click()
drop.onkeydown = (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click() }
}
picker.onchange = () => { for (const f of picker.files) intake(f); picker.value = '' }

// The whole window accepts a drop; both the rail target and the viewer show
// it, since either is a reasonable place to aim.
const targets = [drop, viewer]
const markDrop = (on) => targets.forEach((t) => t.classList.toggle('over', on))

for (const ev of ['dragenter', 'dragover']) {
  document.addEventListener(ev, (e) => { e.preventDefault(); markDrop(true) })
}
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) markDrop(false) })
document.addEventListener('drop', (e) => {
  e.preventDefault()
  markDrop(false)
  for (const f of e.dataTransfer.files) intake(f)
})

// The empty viewer is the primary target, so clicking it opens the picker.
$('empty').onclick = () => { if (!parts.length || !parts[active]?.mesh) picker.click() }

$('bShaded').onclick = () => setMode('shaded')
$('bWire').onclick = () => setMode('wire')
$('bFit').onclick = fit
$('bStl').onclick = () => exportAs('stl')
$('bMf').onclick = () => exportAs('3mf')

renderQueue()
renderReadout()
</script>
</body>
</html>
